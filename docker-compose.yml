services:
  cantus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cantus
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # The canonical public URL where your browser/clients access Cantus.
      # Used for dynamic Spotify OAuth2 PKCE callback resolution.
      # Examples:
      #   Direct LAN IP:  http://192.168.1.50:5000
      #   Reverse Proxy:  https://lyrics.mydomain.com
      #   Local Dev:      http://localhost:5000
      - CANTUS_HOST_URL=${CANTUS_HOST_URL:-http://localhost:5000}

      # Spotify Developer Credentials (from https://developer.spotify.com/dashboard)
      - Spotify__ClientId=${Spotify__ClientId}
      - Spotify__ClientSecret=${Spotify__ClientSecret}
      # Optional overrides (leave unset to allow automatic dynamic host resolution):
      # - Spotify__RedirectUri=${Spotify__RedirectUri}
      # - Lrclib__BaseUrl=https://lrclib.net

      # Reverse proxy trust. Forwarded headers (X-Forwarded-For/-Proto) are
      # only honoured from proxies listed here; the default trusts loopback
      # only. If you front Cantus with a proxy in another container, either
      # list the proxy network or trust all proxies AND stop publishing the
      # port below, so clients can only reach Cantus through the proxy.
      # - ForwardedHeaders__KnownNetworks__0=172.16.0.0/12
      # - ForwardedHeaders__TrustAllProxies=true

      # Cross-origin callers. The bundled web client is same-origin and needs
      # nothing here; only set this if you host the client separately.
      # - Cors__AllowedOrigins__0=https://lyrics.mydomain.com
    volumes:
      # Persistent storage for SQLite database (cantus.db) and DataProtection encryption keys
      - cantus-data:/app/data
    networks:
      - cantus-net

volumes:
  cantus-data:
    name: cantus-data

networks:
  cantus-net:
    name: cantus-net
    driver: bridge
