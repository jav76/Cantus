<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Cantus shows real-time synced lyrics for the music playing on your Spotify account or this computer." />
    <title>Cantus - Real-Time Synced Lyrics</title>
    <!-- Inline so the tab icon needs no request; a separate .svg file would be rasterised by Uno's image resizer. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23c084fc'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cg fill='%23fff'%3E%3Crect x='13' y='28' width='7' height='20' rx='3.5'/%3E%3Crect x='24' y='16' width='7' height='32' rx='3.5'/%3E%3Crect x='35' y='22' width='7' height='26' rx='3.5'/%3E%3Crect x='46' y='32' width='7' height='16' rx='3.5'/%3E%3C/g%3E%3C/svg%3E" />

    <script type="text/javascript" src="./require.js"></script>
    <script type="module" src="./uno-bootstrap.js"></script>
    $(ADDITIONAL_CSS)
    $(ADDITIONAL_HEAD)

    <!-- The loader uses the app's own bundled fonts, so nothing is fetched from another site and the files
         are already cached when the app asks for them. Their folder name changes per build, so it is read
         from the bootstrap script tag above, which the build rewrites. -->
    <script>
        (function() {
            var bootstrap = document.querySelector('script[src*="uno-bootstrap.js"]');
            if (!bootstrap) return;
            var fonts = bootstrap.getAttribute("src").replace(/uno-bootstrap\.js.*$/, "") + "Assets/Fonts/";
            var faces = [
                ["Cantus Loader", "400 500", "Figtree-Regular.ttf"],
                ["Cantus Loader", "600 800", "Figtree-SemiBold.ttf"],
                ["Cantus Loader Mono", "400", "NotoSansMono-Regular.ttf"]
            ];
            var css = faces.map(function(face) {
                return "@font-face { font-family: '" + face[0] + "'; font-weight: " + face[1] +
                    "; font-display: swap; src: url('" + fonts + face[2] + "') format('truetype'); }";
            }).join("\n");
            var style = document.createElement("style");
            style.textContent = css;
            document.head.appendChild(style);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0c0d14;
            color: #f8fafc;
            font-family: 'Cantus Loader', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08), transparent 50%);
        }

        #custom-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9999;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #0c0d14;
        }

        .loader-card {
            background: rgba(18, 20, 32, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 44px 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(139, 92, 246, 0.15);
            max-width: 440px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        .loader-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.12), transparent 70%);
            animation: pulse-glow 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .audio-visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            height: 48px;
            margin-bottom: 28px;
            z-index: 1;
        }

        .audio-bar {
            width: 6px;
            height: 46px;
            background: linear-gradient(180deg, #c084fc 0%, #8b5cf6 50%, #6366f1 100%);
            border-radius: 9999px;
            transform-origin: bottom;
            animation: wave 1.2s ease-in-out infinite alternate backwards;
        }

        .audio-bar:nth-child(1) { animation-delay: 0.1s; }
        .audio-bar:nth-child(2) { animation-delay: 0.3s; }
        .audio-bar:nth-child(3) { animation-delay: 0.5s; }
        .audio-bar:nth-child(4) { animation-delay: 0.2s; }
        .audio-bar:nth-child(5) { animation-delay: 0.4s; }
        .audio-bar:nth-child(6) { animation-delay: 0.15s; }

        /* Scaling keeps the animation on the compositor; animating height forced a layout per frame. */
        @keyframes wave {
            0% { transform: scaleY(0.22); opacity: 0.5; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        .loader-title {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 60%, #818cf8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 1;
        }

        .loader-subtitle {
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 28px;
            letter-spacing: 0.02em;
            z-index: 1;
        }

        .loader-progress-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .loader-progress-bar {
            height: 100%;
            width: 5%;
            background: linear-gradient(90deg, #8b5cf6 0%, #a855f7 50%, #34d399 100%);
            border-radius: 9999px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
        }

        .loader-status-text {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 12px;
            font-size: 11px;
            font-family: 'Cantus Loader Mono', ui-monospace, monospace;
            color: #64748b;
            z-index: 1;
        }

        #uno-body {
            opacity: 0;
            transition: opacity 0.5s ease-in;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .uno-loader {
            display: none !important;
        }

        /* Uno's DOM renderer does not pass a TextBox's Foreground to the native field, which then keeps the
           browser's black text. Inheriting from the themed parent makes typed text follow the active theme. */
        input,
        textarea {
            color: inherit;
            caret-color: currentColor;
        }
    </style>
</head>
<body>
    <div id="custom-loader">
        <div class="loader-card">
            <!-- Neon Equalizer Wavebars -->
            <div class="audio-visualizer">
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
            </div>
            
            <h1 class="loader-title">Cantus</h1>
            <div class="loader-subtitle">Real-Time Spotify Synced Lyrics</div>

            <!-- Progress Bar -->
            <div class="loader-progress-container">
                <div id="custom-progress-bar" class="loader-progress-bar"></div>
            </div>

            <!-- Live Status & Percentage -->
            <div class="loader-status-text">
                <span id="loader-phase">Loading .NET 10 WASM...</span>
                <span id="loader-percent">0%</span>
            </div>
        </div>
    </div>

    <div id="uno-body" class="container-fluid uno-body">
        <div class="uno-loader" loading-position="bottom" loading-alert="none">
            <progress></progress>
            <span class="alert"></span>
        </div>
    </div>
    <noscript>
        <p>This application requires WebAssembly to be enabled.</p>
    </noscript>

    <script>
        window.CantusInterop = {
            getOrigin: function() {
                return window.location.origin || (window.location.protocol + "//" + window.location.host);
            },
            navigateTo: function(url) {
                window.location.href = url;
            },
            getAuthQuery: function() {
                var params = new URLSearchParams(window.location.search);
                return params.get("auth") || "";
            },
            cleanAuthQuery: function() {
                if (window.location.search && (window.location.search.indexOf("auth=") !== -1)) {
                    var cleanUrl = window.location.pathname;
                    window.history.replaceState({}, document.title, cleanUrl);
                }
            },
            isDocumentVisible: function() {
                return !document.hidden;
            },
            getLocationSearch: function() {
                return window.location.search || "";
            },
            removeQueryParameter: function(name) {
                var url = new URL(window.location.href);
                if (!url.searchParams.has(name)) {
                    return;
                }
                url.searchParams.delete(name);
                window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
            }
        };

        // Live levels for the seek bar VU meter (Services/Audio/BrowserAudioLevelSource.cs).
        // Each start carries a session id so a superseded capture can never stop or feed a newer one.
        window.CantusAudio = (function() {
            var current = null;
            var latestId = 0;

            function release(capture) {
                capture.stream.getTracks().forEach(function(track) { track.stop(); });
                capture.context.close().catch(function() {});
            }

            function stopAll(stream) {
                stream.getTracks().forEach(function(track) { track.stop(); });
            }

            return {
                supports: function(kind) {
                    var devices = navigator.mediaDevices;
                    if (!window.isSecureContext || !devices || !(window.AudioContext || window.webkitAudioContext)) {
                        return false;
                    }
                    return kind === "microphone"
                        ? typeof devices.getUserMedia === "function"
                        : typeof devices.getDisplayMedia === "function";
                },
                start: async function(kind, id) {
                    latestId = id;
                    if (current) {
                        release(current);
                        current = null;
                    }

                    var stream;
                    try {
                        stream = kind === "microphone"
                            ? await navigator.mediaDevices.getUserMedia({
                                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
                            })
                            : await navigator.mediaDevices.getDisplayMedia({
                                video: true,
                                audio: true,
                                systemAudio: "include",
                                selfBrowserSurface: "exclude"
                            });
                    } catch (e) {
                        return e && (e.name === "NotAllowedError" || e.name === "SecurityError") ? "denied" : "error";
                    }

                    if (id !== latestId) {
                        stopAll(stream);
                        return "superseded";
                    }

                    // Only the audio is analysed; dropping the video track saves the screen capture work.
                    stream.getVideoTracks().forEach(function(track) { track.stop(); });
                    var audioTracks = stream.getAudioTracks();
                    if (audioTracks.length === 0) {
                        stopAll(stream);
                        return "no-audio";
                    }

                    var AudioContextType = window.AudioContext || window.webkitAudioContext;
                    var context = new AudioContextType();
                    var analyser = context.createAnalyser();
                    analyser.fftSize = 2048;
                    analyser.smoothingTimeConstant = 0.5;
                    analyser.minDecibels = -80;
                    analyser.maxDecibels = -22;
                    context.createMediaStreamSource(stream).connect(analyser);

                    var capture = {
                        id: id,
                        stream: stream,
                        context: context,
                        analyser: analyser,
                        bins: new Uint8Array(analyser.frequencyBinCount),
                        ended: false
                    };
                    audioTracks.forEach(function(track) {
                        track.addEventListener("ended", function() { capture.ended = true; });
                    });

                    if (context.state === "suspended") {
                        context.resume().catch(function() {});
                        document.addEventListener("pointerdown", function() { context.resume().catch(function() {}); }, { once: true });
                    }

                    current = capture;
                    return "ok";
                },
                readBins: function(id, view) {
                    if (!current || current.id !== id || current.ended) {
                        return -1;
                    }
                    if (current.context.state !== "running") {
                        return 0;
                    }
                    current.analyser.getByteFrequencyData(current.bins);
                    view.set(current.bins);
                    return current.context.sampleRate;
                },
                stop: function(id) {
                    if (current && current.id === id) {
                        release(current);
                        current = null;
                    }
                }
            };
        })();

        // Uno's DOM renderer creates <img> elements without an alt attribute. Each one takes the accessible
        // name of its Image control (AutomationProperties.Name, on the parent element), or is marked decorative.
        (function() {
            function describe(img) {
                if (img.hasAttribute("alt")) return;
                var owner = img.parentElement;
                img.alt = (owner && owner.getAttribute("aria-label")) || "";
            }

            function describeAll(node) {
                if (node.nodeType !== 1) return;
                if (node.tagName === "IMG") {
                    describe(node);
                } else if (node.firstElementChild) {
                    node.querySelectorAll("img:not([alt])").forEach(describe);
                }
            }

            new MutationObserver(function(mutations) {
                for (var i = 0; i < mutations.length; i++) {
                    mutations[i].addedNodes.forEach(describeAll);
                }
            }).observe(document.documentElement, { childList: true, subtree: true });
        })();

        (function() {
            function initLoader() {
                var defaultLoader = document.querySelector(".uno-loader");
                var customLoader = document.getElementById("custom-loader");
                var customProgressBar = document.getElementById("custom-progress-bar");
                var loaderPhase = document.getElementById("loader-phase");
                var loaderPercent = document.getElementById("loader-percent");
                var unoBody = document.getElementById("uno-body");
                var loadComplete = false;

                function updateProgress(val) {
                    var pct = Math.min(100, Math.max(0, Math.round(val)));
                    if (customProgressBar) customProgressBar.style.width = pct + "%";
                    if (loaderPercent) loaderPercent.innerText = pct + "%";

                    if (!loaderPhase) return;
                    if (pct < 30) {
                        loaderPhase.innerText = "Downloading .NET 10 Assemblies...";
                    } else if (pct < 65) {
                        loaderPhase.innerText = "Initializing JIT & WebAssembly...";
                    } else if (pct < 90) {
                        loaderPhase.innerText = "Starting Lyrics Engine...";
                    } else if (pct < 100) {
                        loaderPhase.innerText = "Preparing UI...";
                    } else {
                        loaderPhase.innerText = "Ready!";
                    }
                }

                var simulatedProgress = 12;
                updateProgress(simulatedProgress);

                var simInterval = setInterval(function() {
                    if (loadComplete) {
                        clearInterval(simInterval);
                        return;
                    }
                    if (simulatedProgress < 85) {
                        simulatedProgress += (88 - simulatedProgress) * 0.08;
                        updateProgress(simulatedProgress);
                    }
                }, 250);

                function finishLoading() {
                    if (loadComplete) return;
                    loadComplete = true;
                    if (simInterval) clearInterval(simInterval);
                    if (pollInterval) clearInterval(pollInterval);
                    if (bodyObserver) bodyObserver.disconnect();
                    updateProgress(100);

                    setTimeout(function() {
                        if (customLoader) {
                            customLoader.style.opacity = "0";
                            customLoader.style.visibility = "hidden";
                        }
                        if (unoBody) {
                            unoBody.style.opacity = "1";
                        }
                        setTimeout(function() {
                            if (customLoader && customLoader.parentNode) {
                                customLoader.parentNode.removeChild(customLoader);
                            }
                        }, 600);
                    }, 300);
                }

                function checkUnoReadiness() {
                    if (loadComplete) return;

                    var progressElem = document.querySelector(".uno-loader progress") || document.querySelector("progress");
                    if (progressElem && typeof progressElem.value === "number" && progressElem.max > 0) {
                        var realPct = (progressElem.value / progressElem.max) * 100;
                        if (realPct > 0) {
                            updateProgress(Math.max(realPct, simulatedProgress));
                        }
                        if (realPct >= 100) {
                            finishLoading();
                            return;
                        }
                    }

                    // Check if Uno has attached UI elements (canvas / div / visual tree) inside uno-body
                    if (unoBody && unoBody.children.length > 0) {
                        var hasUnoAppElements = Array.from(unoBody.children).some(function(child) {
                            return !child.classList.contains("uno-loader") && child.tagName.toLowerCase() !== "noscript";
                        });
                        if (hasUnoAppElements) {
                            finishLoading();
                            return;
                        }
                    }

                    // Check if default uno-loader was removed by Uno Bootstrapper cleanup
                    if (defaultLoader && !document.body.contains(defaultLoader) && !unoBody.contains(defaultLoader)) {
                        finishLoading();
                        return;
                    }
                }

                var pollInterval = setInterval(checkUnoReadiness, 200);
                var bodyObserver = null;

                if (unoBody) {
                    bodyObserver = new MutationObserver(function(mutations) {
                        checkUnoReadiness();
                    });
                    bodyObserver.observe(unoBody, { childList: true, subtree: true });
                }

                window.addEventListener("error", function(evt) {
                    console.error("Client Runtime Error:", evt.message, evt.error);
                });
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", initLoader);
            } else {
                initLoader();
            }
        })();
    </script>
</body>
</html>
