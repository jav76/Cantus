site_name: Cantus
site_description: Self-Hosted, Real-Time Synchronized Lyrics Display Platform
site_author: Cantus Team
site_url: https://cantus.docs.jav26122.net
repo_name: jav76/Cantus
repo_url: https://github.com/jav76/Cantus
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Exclude private developer scratchpad and local notes
exclude_docs: |
  local/**

theme:
  name: material
  language: en
  palette:
    # Palette toggle for dark mode (default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Palette toggle for light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
      - Overview: user-guide/index.md
      - Playback & Display: user-guide/playback-and-display.md
      - Timing & Latency Calibration: user-guide/timing-and-calibration.md
      - Dynamic Theming: user-guide/theming.md
  - Operator Guide:
      - Overview: operator-guide/index.md
      - Self-Hosting with Docker: operator-guide/self-hosting.md
      - Spotify App Setup: operator-guide/spotify-setup.md
      - Reverse Proxy Setup: operator-guide/reverse-proxy.md
      - Troubleshooting: operator-guide/troubleshooting.md
  - Architecture:
      - Overview: architecture/overview.md
      - NTP Clock Synchronization: architecture/ntp-clock-sync.md
      - Adaptive Polling Engine: architecture/adaptive-polling.md
      - Multi-Tier Lyrics Caching: architecture/lyrics-caching.md
      - Client & Uno Platform: architecture/client-uno.md
  - Reference:
      - SignalR PlaybackHub Protocol: reference/signalr-api.md
      - REST API Endpoints: reference/rest-api.md
      - Configuration & Environment: reference/configuration.md
  - Contributing:
      - Contributing Guide: contributing/index.md
