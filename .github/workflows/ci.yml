name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Uno WebAssembly Workload
        run: dotnet workload install wasm-tools

      - name: Restore Dependencies
        run: dotnet restore Cantus.slnx

      - name: Verify Code Formatting
        run: dotnet format whitespace Cantus.slnx --verify-no-changes

      - name: Build Solution
        run: dotnet build Cantus.slnx --configuration Release --no-restore

      - name: Run Test Suites
        run: dotnet test Cantus.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  docker-smoke-test:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cantus:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
