name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ============================================================================
  # 1. Code Style & Formatting Advisory (Non-blocking)
  # ============================================================================
  format-check:
    name: Code Style & Formatting (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: Cantus.slnx

      - name: Install Uno WebAssembly Workload
        run: dotnet workload install wasm-tools

      - name: Restore Dependencies
        run: dotnet restore Cantus.slnx

      - name: Check Code Style & Formatting
        shell: bash
        run: |
          echo "Running solution code formatting & style inspection..."
          if ! dotnet format Cantus.slnx --no-restore --verify-no-changes --severity warn; then
            echo "::warning title=Formatting Advisory::Code formatting or style suggestions found. Run 'dotnet format' locally to apply automatic fixes."
            {
              echo "### ⚠️ Code Formatting & Style Advisory"
              echo "Formatting differences were detected against the solution ruleset. This check is advisory and will not block your build or pull request."
              echo "To apply suggested formatting automatically, run:"
              echo '```bash'
              echo 'dotnet format'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Code Formatting::All files conform to formatting and style rules."
            {
              echo "### ✅ Code Formatting & Style Passed"
              echo "No formatting or style discrepancies found."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # 2. Build & Test Matrix (.NET 10)
  #    - On PRs: Fast single-runner execution on Linux (ubuntu-latest)
  #    - On main push: Cross-platform OS matrix (Linux, Windows, macOS)
  # ============================================================================
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: Cantus.slnx

      - name: Install Uno WebAssembly Workload
        run: dotnet workload install wasm-tools

      - name: Restore Dependencies
        run: dotnet restore Cantus.slnx

      - name: Build Solution
        run: dotnet build Cantus.slnx --configuration Release --no-restore

      - name: Run Test Suites
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: >
          dotnet test Cantus.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test_results_${MATRIX_OS}.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload Test Results & Coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults
          if-no-files-found: ignore

  # ============================================================================
  # 3. Docker Container Build Smoke Test
  # ============================================================================
  docker-smoke-test:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker Container (Dry Run)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cantus:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. Unified Status Gatekeeper (Required Check for Branch Protection)
  # ============================================================================
  ci-gate:
    name: CI Gatekeeper (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [format-check, build-and-test, docker-smoke-test]
    if: always()
    permissions: {}

    steps:
      - name: Evaluate Status of All CI Checks
        shell: bash
        env:
          FORMAT_RESULT: ${{ needs.format-check.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          DOCKER_RESULT: ${{ needs.docker-smoke-test.result }}
        run: |
          echo "=========================================="
          echo " CI Verification Summary"
          echo "=========================================="
          echo " Code Style (Advisory): ${FORMAT_RESULT}"
          echo " Build & Test Matrix:   ${BUILD_RESULT}"
          echo " Docker Smoke Test:     ${DOCKER_RESULT}"
          echo "=========================================="

          if [ "${BUILD_RESULT}" != "success" ] || \
             [ "${DOCKER_RESULT}" != "success" ]; then
            echo "::error::One or more required CI checks (Build/Test or Docker) failed or were cancelled. PR cannot be merged."
            exit 1
          fi

          echo "::notice::All required CI checks passed successfully. Solution is green and ready to merge!"
