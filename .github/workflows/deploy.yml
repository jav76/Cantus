name: Deploy (Development Stack)

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  # Runs on the self-hosted `cantus` runner, which has the host Docker socket and
  # the stack's compose directory mounted at the same path as on the host.
  deploy:
    name: Deploy Release Image
    runs-on: [self-hosted, cantus]
    env:
      COMPOSE_DIR: /opt/Docker/Development/Cantus

    steps:
      - name: Resolve Image
        id: image
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: '${TAG}'"
            exit 1
          fi
          echo "REF=ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pull Image
        run: docker pull "${{ steps.image.outputs.REF }}"

      # The stack's own compose file and .env stay authoritative; the override
      # only swaps the locally built image for the released one.
      - name: Recreate Container
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.REF }}
        run: |
          set -euo pipefail
          OVERRIDE="$RUNNER_TEMP/cantus-release.override.yml"
          printf 'services:\n  cantus:\n    image: %s\n' "$IMAGE" > "$OVERRIDE"
          docker compose \
            --project-name cantus \
            --project-directory "$COMPOSE_DIR" \
            -f "$COMPOSE_DIR/docker-compose.yml" \
            -f "$OVERRIDE" \
            up -d --no-build --wait cantus

      - name: Verify Health
        shell: bash
        run: |
          set -euo pipefail
          if ! docker run --rm --network cantus-net curlimages/curl:8.11.1 \
              -fsS --retry 30 --retry-delay 2 --retry-all-errors http://cantus:5000/api/health; then
            docker logs --tail 100 cantus
            exit 1
          fi
          echo "### 🚢 Deployed \`${{ steps.image.outputs.REF }}\` to the development stack" >> "$GITHUB_STEP_SUMMARY"
