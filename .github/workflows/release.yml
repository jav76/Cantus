name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 0. Centralized Version & Tag Preparation
  # ============================================================================
  prepare:
    name: Prepare Release Metadata
    runs-on: [self-hosted, cantus]
    outputs:
      version: ${{ steps.meta.outputs.VERSION }}
      tag: ${{ steps.meta.outputs.TAG }}
      is_prerelease: ${{ steps.meta.outputs.IS_PRERELEASE }}

    steps:
      - name: Parse and Validate Version & Tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
            if [ -z "${RAW_VER}" ]; then
              echo "::error::Release version tag is required when triggering manually."
              exit 1
            fi
          else
            if [[ ! "${{ github.ref }}" =~ ^refs/tags/ ]]; then
              echo "::error::Release workflow triggered by push, but ref is not a tag: ${{ github.ref }}"
              exit 1
            fi
            RAW_VER="${{ github.ref_name }}"
          fi

          CLEAN_VER="${RAW_VER#v}"

          # Enforce SemVer 2.0 pattern (e.g. 1.0.0, 1.0.0-rc.1, 1.0.0-beta.2)
          SEMVER_REGEX="^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$"
          if [[ ! "${CLEAN_VER}" =~ ${SEMVER_REGEX} ]]; then
            echo "::error::Invalid SemVer version: '${RAW_VER}'. Expected format like 'v1.0.0' or 'v1.0.0-rc.1'."
            exit 1
          fi

          TAG="v${CLEAN_VER}"
          IS_PRERELEASE="false"
          if [[ "${CLEAN_VER}" == *"-"* ]]; then
            IS_PRERELEASE="true"
          fi

          echo "VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

          echo "### 🚀 Release Metadata Prepared" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Tag**: \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Semantic Version**: \`${CLEAN_VER}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release**: \`${IS_PRERELEASE}\`" >> $GITHUB_STEP_SUMMARY

      # The draft release is created before any build runs so that each matrix
      # job can attach its own packages directly, rather than pushing ~750 MB
      # through artifact storage for one job to download again.
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.TAG }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be added to it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "$TAG"
          fi

  # ============================================================================
  # 1. Multi-Architecture Container Publishing (GHCR)
  # ============================================================================
  publish-docker:
    name: Publish Multi-Arch Docker Image (GHCR)
    needs: [prepare]
    runs-on: [self-hosted, cantus]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_prerelease == 'false' }}
            type=raw,value=rc,enable=${{ needs.prepare.outputs.is_prerelease == 'true' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Cross-Platform Desktop Client Matrix Builds
  # ============================================================================
  build-desktop-clients:
    name: Build Desktop Client (${{ matrix.name }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: Windows-x64
          - os: [self-hosted, cantus]
            rid: linux-x64
            name: Linux-x64
          - os: macos-latest
            rid: osx-x64
            name: macOS-x64
          - os: macos-latest
            rid: osx-arm64
            name: macOS-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Self-Contained Desktop Client
        run: >
          dotnet publish src/Cantus.Client/Cantus.Client/Cantus.Client.csproj
          -f net10.0-desktop
          -r ${{ matrix.rid }}
          -c Release
          -p:PublishSingleFile=true
          -p:Version="${{ needs.prepare.outputs.version }}"
          -p:SourceRevisionId="${{ github.sha }}"
          --self-contained true
          -o ./publish

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p ./artifacts
          tar -czvf "./artifacts/Cantus.Client-Linux-x64.tar.gz" -C ./publish .
          ./packaging/linux/build-appimage.sh ./publish ./artifacts "${{ needs.prepare.outputs.version }}"

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts
          Compress-Archive -Path ./publish/* -DestinationPath ./artifacts/Cantus.Client-Windows-x64.zip
          
          # Compile Inno Setup Installer
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $isccPath)) {
            choco install innosetup --yes --no-progress
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          }
          & $isccPath /DSourceDir="$((Get-Location).Path)\publish" /DMyAppVersion="${{ needs.prepare.outputs.version }}" /O"$((Get-Location).Path)\artifacts" packaging\windows\installer.iss

      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ./artifacts
          tar -czvf "./artifacts/Cantus.Client-macOS-${{ matrix.rid }}.tar.gz" -C ./publish .

      # Checksums are produced here, next to the files, so the finalize job never
      # needs to re-download the binaries to hash them.
      - name: Attach Packages to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd ./artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            HASH="sha256sum"
          else
            HASH="shasum -a 256"
          fi
          : > "../CHECKSUMS-desktop-${{ matrix.name }}.txt"
          for f in *; do
            [ -f "$f" ] || continue
            $HASH "$f" >> "../CHECKSUMS-desktop-${{ matrix.name }}.txt"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          cat "../CHECKSUMS-desktop-${{ matrix.name }}.txt"

      - name: Upload Checksum Fragment
        uses: actions/upload-artifact@v4
        with:
          name: checksums-desktop-${{ matrix.name }}
          path: ./CHECKSUMS-desktop-${{ matrix.name }}.txt
          retention-days: 7
          if-no-files-found: error

  # ============================================================================
  # 3. Standalone Server Binaries Matrix (Bare-Metal Deployments)
  # ============================================================================
  build-server-binaries:
    name: Build Server Binary (${{ matrix.name }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, cantus]
            rid: linux-x64
            name: Linux-x64
            archive_ext: tar.gz
          - os: [self-hosted, cantus]
            rid: linux-arm64
            name: Linux-arm64
            archive_ext: tar.gz
          - os: windows-latest
            rid: win-x64
            name: Windows-x64
            archive_ext: zip
          - os: macos-latest
            rid: osx-arm64
            name: macOS-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Uno WebAssembly Workload
        run: dotnet workload install wasm-tools

      - name: Publish WASM Client
        run: >
          dotnet publish src/Cantus.Client/Cantus.Client/Cantus.Client.csproj
          -f net10.0-browserwasm
          -c Release
          -p:Version="${{ needs.prepare.outputs.version }}"
          -p:SourceRevisionId="${{ github.sha }}"
          -o ./wasm_dist

      - name: Publish Standalone Server
        run: >
          dotnet publish src/Cantus.Server/Cantus.Server.csproj
          -r ${{ matrix.rid }}
          -c Release
          -p:PublishSingleFile=true
          -p:Version="${{ needs.prepare.outputs.version }}"
          -p:SourceRevisionId="${{ github.sha }}"
          --self-contained true
          -o ./server_dist

      - name: Bundle Static WASM into Server Output
        shell: bash
        run: |
          mkdir -p ./server_dist/wwwroot
          cp -r ./wasm_dist/wwwroot/* ./server_dist/wwwroot/

      - name: Archive Server Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p ./artifacts
          tar -czvf "./artifacts/Cantus.Server-${{ matrix.name }}.tar.gz" -C ./server_dist .

      - name: Archive Server Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts
          Compress-Archive -Path ./server_dist/* -DestinationPath ./artifacts/Cantus.Server-Windows-x64.zip

      # Checksums are produced here, next to the files, so the finalize job never
      # needs to re-download the binaries to hash them.
      - name: Attach Packages to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd ./artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            HASH="sha256sum"
          else
            HASH="shasum -a 256"
          fi
          : > "../CHECKSUMS-server-${{ matrix.name }}.txt"
          for f in *; do
            [ -f "$f" ] || continue
            $HASH "$f" >> "../CHECKSUMS-server-${{ matrix.name }}.txt"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          cat "../CHECKSUMS-server-${{ matrix.name }}.txt"

      - name: Upload Checksum Fragment
        uses: actions/upload-artifact@v4
        with:
          name: checksums-server-${{ matrix.name }}
          path: ./CHECKSUMS-server-${{ matrix.name }}.txt
          retention-days: 7
          if-no-files-found: error

  # ============================================================================
  # 4. GitHub Release Publishing & Asset Aggregation
  # ============================================================================
  publish-release:
    name: Create GitHub Release
    needs: [prepare, publish-docker, build-desktop-clients, build-server-binaries]
    runs-on: [self-hosted, cantus]
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Only the small checksum fragments travel through artifact storage; the
      # packages themselves are already attached to the draft release.
      - name: Download Checksum Fragments
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: ./checksums
          merge-multiple: true

      - name: Aggregate Checksums
        shell: bash
        run: |
          set -euo pipefail
          cat ./checksums/CHECKSUMS-*.txt | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$IS_PRERELEASE"
          {
            echo "### 📦 Published $TAG"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # 5. Deploy to the Local Development Stack
  # ============================================================================
  deploy:
    name: Deploy to Development Stack
    needs: [prepare, publish-release]
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
